name: wiki

# Rebuild the wiki from wiki/ and the project facts in scripts/, then mirror wiki/
# into the repo's GitHub wiki. The wiki's own git repo only exists once a first page
# has been created through the web UI.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["wiki/**", "scripts/wiki.py", "scripts/build.py", "scripts/svgkit.py", ".github/workflows/wiki.yml"]

permissions:
  contents: write

concurrency: wiki

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild pages and images
        run: python scripts/wiki.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki assets/img/wiki
          git diff --cached --quiet || (git commit -m "chore: rebuild wiki" && git push)
      - name: Publish to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          rsync -a --delete --exclude .git --exclude .templates wiki/ "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync from ${GITHUB_SHA::7}" && git push)
