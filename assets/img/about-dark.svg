<svg xmlns="http://www.w3.org/2000/svg" width="850" height="348" viewBox="0 0 850 348" role="img" aria-label="Six years shipping systems people depend on. Now building them AI-first. Senior Full Stack Engineer at IBM Consulting. I lead teams, architect Spring Boot backends and ship Angular and React front ends for enterprise platforms, and I build the AI layer into them: agentic delivery pipelines, MCP servers and tools where the model is part of the architecture, not a plugin."><title>Six years shipping systems people depend on. Now building them AI-first. Senior Full Stack Engineer at IBM Consulting. I lead teams, architect Spring Boot backends and ship Angular and React front ends for enterprise platforms, and I build the AI layer into them: agentic delivery pipelines, MCP servers and tools where the model is part of the architecture, not a plugin.</title><style>@font-face{font-family:SPMono7;src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}@font-face{font-family:SPMono;src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal}@font-face{font-family:SPDisplay7;src:url(data:font/woff2;base64,) format('woff2');font-weight:700;font-style:normal}@font-face{font-family:SPSerif;src:url(data:font/woff2;base64,) format('woff2');font-weight:450;font-style:italic}.m7{font-family:SPMono7,ui-monospace,Menlo,monospace;font-weight:700;font-style:normal}.m4{font-family:SPMono,ui-monospace,Menlo,monospace;font-weight:400;font-style:normal}.d7{font-family:SPDisplay7,'Helvetica Neue',Arial,sans-serif;font-weight:700;font-style:normal}.si{font-family:SPSerif,Georgia,serif;font-weight:450;font-style:italic}</style><rect x="8" y="8" width="838" height="338" rx="3" fill="#0a0b0f" /><rect x="3" y="3" width="838" height="338" rx="3" fill="#bef264" /><rect x="0" y="0" width="838" height="338" rx="3" fill="#16181f" stroke="#454d61" stroke-width="1.2" /><text x="26" y="38" class="m7" font-size="11" fill="#656c7c" text-anchor="start